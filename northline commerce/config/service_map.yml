# How the Northline Commerce order pipeline is wired (sanitized).
# No real hosts. Used so code search finds related service names.

client: northline-commerce
environment: env-web-01
owner_team: dev-platform

services:
  checkout-web:
    role: storefront and checkout
    writes: [orders]
    depends_on: [order-api, payments-api]
  payments-api:
    role: provider callbacks, payment records, outbox append
    handles: payments/capture_handler.py
    writes: [payments, payment_events]
    changes_order_state: false        # deliberate — see capture_handler.py
  fulfillment-worker:
    role: applies payment events to orders
    drains: payment_events
    applies: fulfillment/event_drain.py
    cursor: payment_events_cursor     # single global cursor, strict seq order
    on_unappliable_event: stop        # never skips, never advances past it
  order-api:
    role: order reads and cancellations
    state_machine: orders/state_machine.py

# Shared failure mode worth knowing before you page anyone: an order stuck in
# payment_pending with a captured payment is almost never a payments-api or a
# provider problem. Both of those look healthy while it happens. It means the
# fulfilment drain is not advancing, and the drain does not advance while the
# event at the head of payment_events cannot be applied.
# Read the head event (ops/stuck_orders.sql) then follow
# ops/quarantine_blocking_event.py. Runtime data only; no deploy.
