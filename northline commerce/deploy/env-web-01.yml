# Deploy descriptor for env-web-01 (sanitized — no live hosts, no secrets).
# Environment built 2021 by our platform team; operated by us since.
environment: env-web-01
client: northline-commerce
display_name: Northline Commerce
edge:
  control: edge-access-control
  admin_path: /admin
  allowlist:
    - 203.0.113.0/24
  verifier_key: secret/clients/northline/env-web-01/edge-verifier
  verifier_fail_mode: closed   # since 2026-05: no verifier key = deny, even for allowlisted IPs
origin:
  app: web-app
secrets:
  store: credential-vault
  admin_path: secret/clients/northline/env-web-01/admin
  retrieval_timeout_ms: 2000
  fail_mode: closed   # no cached fallback — admin waits if the vault is down
owner:
  documented: TBD
  informal: Maya Chen
