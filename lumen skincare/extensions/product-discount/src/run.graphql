query RunInput {
  cart {
    lines {
      quantity
      sellingPlanAllocation {
        sellingPlan {
          id
        }
      }
      merchandise {
        ... on ProductVariant {
          id
        }
      }
    }
  }
  discountNode {
    metafield(namespace: "$app:product-discount", key: "function-configuration") {
      value
    }
  }
}
